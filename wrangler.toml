name = "support-saas"
main = "worker/index.js"
compatibility_date = "2024-11-01"

# Static files (admin/buyer/install pages) served from ./public
#
# run_worker_first: without this, Cloudflare's static-asset layer handles
# requests BEFORE the Worker ever runs, and for a path like /install/<code>
# (which doesn't match any real file) it was redirecting to /install/ on its
# own — stripping the code from the URL before our code ever got to decide
# what to serve. Found via live browser testing (a real client's install
# link broke with "Could not reach the server"). Forcing the Worker to run
# first lets worker/index.js's own routes handle things like /install/<code>
# correctly; it already falls through to env.ASSETS.fetch(request) for
# anything it doesn't own, so this is safe for every other path too.
#
# NOTE: this must be the boolean `true`, not an array of path patterns —
# the per-path array form needs Wrangler 4, but Cloudflare's "Connect to
# Git" build pipeline pins Wrangler 3.x (see package.json), which only
# understands the boolean. An array here passed locally (where a newer
# wrangler may be installed) but broke every CI deploy with "Expected
# assets.run_worker_first to be of type boolean" — silently, since the
# build log for that isn't shown by default in the dashboard UI.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "support_saas_db"
database_id = "6576fb82-9484-46e9-afed-0ce7bcff4dab"

# Secrets — set via Cloudflare dashboard (Settings > Variables and secrets,
# mark as "Encrypted") or `wrangler secret put <NAME>`. Never commit these.
#   TS_OAUTH_CLIENT_ID      Tailscale OAuth client id (dedicated SaaS tailnet)
#   TS_OAUTH_CLIENT_SECRET  Tailscale OAuth client secret (same OAuth client)
#   TS_TAILNET              usually "-" (the OAuth client's own tailnet)
# See README.md "Phase 2 setup" for how to create these.
